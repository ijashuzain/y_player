name: y_player
description: "YPlayer is a Flutter package that provides an easy-to-use YouTube
  video player widget"
version: 2.1.0
repository: https://github.com/ijashuzain/y_player

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.2.0
  media_kit_libs_video: ^1.0.6
  media_kit_video: ^1.3.0
  # 3.1.0 adds the androidSdkless / mediaConnect / safari clients that the
  # extraction fallback chain depends on.
  youtube_explode_dart: ^3.1.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
